[package]
name = "wzlib-py"
version = "0.1.4"
edition = "2021"
description = "Python bindings for wzlib-rs — MapleStory WZ file parser and editor"

[lib]
name = "_wzlib"
crate-type = ["cdylib"]

[dependencies]
wzlib-rs = { path = ".." }
pyo3 = { version = "0.28", features = ["extension-module"] }
base64 = "0.22"
png = "0.17"

[profile.release]
lto = true
opt-level = 3
strip = true
